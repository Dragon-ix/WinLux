[Rainmeter]
Update=-1
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1

[Variables]
@include=#@#Variables.inc
Scale=#DkScale#
; --- CUSTOM PATHS & ICONS ---
; Replace this path with your actual zen.exe path if different:
ZenPath="C:\Program Files\Zen Browser\zen.exe"
ZenIcon=#@#Images\Zen.png

;=============================================================
; BACKGROUND SHAPE (Resized width from 577 to 480 to fit 5 icons perfectly)
;=============================================================

[MeterRoundedRectangle]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,480,100,30 | Extend MyModifiers
MyModifiers=Fill Color #ContainerColor# | StrokeWidth 0 | Stroke Color 46,115,31,0

;=============================================================
; DOCK ICONS (Normal State)
;=============================================================

[MeterIcon1]
Meter=Image
X=(25*#Scale#)
Y=(14*#Scale#)
W=(52*#Scale#)
MouseOverAction=[!ShowMeter MeterIcon1Hover][!HideMeter MeterIcon1][!Update]
ImageName=#Icon1NameAndPath#
AntiAlias=1

[MeterIcon2]
Meter=Image
X=(72*#Scale#)r
Y=(0*#Scale#)r
W=(52*#Scale#)
MouseOverAction=[!ShowMeter MeterIcon2Hover][!HideMeter MeterIcon2][!Update]
ImageName=#Icon2NameAndPath#
AntiAlias=1

; Icon 3: Zen Browser (Replaces Chrome)
[MeterIcon3]
Meter=Image
X=(72*#Scale#)r
Y=(0*#Scale#)r
W=(52*#Scale#)
MouseOverAction=[!ShowMeter MeterIcon3Hover][!HideMeter MeterIcon3][!Update]
ImageName=#ZenIcon#
ImageTint=225,225,225
AntiAlias=1

; Icon 4: Headphones / Music
[MeterIcon4]
Meter=Image
X=(72*#Scale#)r
Y=(0*#Scale#)r
W=(52*#Scale#)
MouseOverAction=[!ShowMeter MeterIcon4Hover][!HideMeter MeterIcon4][!Update]
ImageName=#Icon4NameAndPath#
AntiAlias=1

; Icon 5: Settings / Controls (Replaces WhatsApp slot)
[MeterIcon5]
Meter=Image
X=(72*#Scale#)r
Y=(0*#Scale#)r
W=(52*#Scale#)
MouseOverAction=[!ShowMeter MeterIcon5Hover][!HideMeter MeterIcon5][!Update]
ImageName=#Icon6NameAndPath#
AntiAlias=1

;=============================================================
; DOCK ICONS (Hover State & Click Actions)
;=============================================================

[MeterIcon1Hover]
Meter=Image
ImageName=#Icon1NameAndPath#
X=(22*#Scale#)
Y=(11*#Scale#)
W=(59*#Scale#)
MouseLeaveAction=[!ShowMeter MeterIcon1][!HideMeter MeterIcon1Hover][!Update]
LeftMouseUpAction=#LocationPath1#
DynamicVariables=1
AntiAlias=1
Hidden=1

[MeterIcon2Hover]
Meter=Image
ImageName=#Icon2NameAndPath#
X=(72*#Scale#)r
Y=(0*#Scale#)r
W=(59*#Scale#)
MouseLeaveAction=[!ShowMeter MeterIcon2][!HideMeter MeterIcon2Hover][!Update]
LeftMouseUpAction=#LocationPath2#
AntiAlias=1
Hidden=1

; Zen Hover & Launch Action
[MeterIcon3Hover]
Meter=Image
ImageName=#ZenIcon#
X=(72*#Scale#)r
Y=(0*#Scale#)r
W=(59*#Scale#)
MouseLeaveAction=[!ShowMeter MeterIcon3][!HideMeter MeterIcon3Hover][!Update]
LeftMouseUpAction=["#ZenPath#"]
ImageTint=225,225,225
DynamicVariables=1
AntiAlias=1
Hidden=1

[MeterIcon4Hover]
Meter=Image
ImageName=#Icon4NameAndPath#
X=(72*#Scale#)r
Y=(0*#Scale#)r
W=(59*#Scale#)
MouseLeaveAction=[!ShowMeter MeterIcon4][!HideMeter MeterIcon4Hover][!Update]
LeftMouseUpAction=#LocationPath4#
AntiAlias=1
Hidden=1

[MeterIcon5Hover]
Meter=Image
ImageName=#Icon6NameAndPath#
X=(72*#Scale#)r
Y=(0*#Scale#)r
W=(59*#Scale#)
MouseLeaveAction=[!ShowMeter MeterIcon5][!HideMeter MeterIcon5Hover][!Update]
LeftMouseUpAction=#LocationPath6#
AntiAlias=1
Hidden=1