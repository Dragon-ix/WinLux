[Rainmeter]
Update=1000
Author=-R
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1
AccurateText=1
LeftMouseDoubleClickAction=#@#Variables.inc

[Variables]
@include=#@#Variables.inc
@include2=#@#Language\Language.inc
Scale=#CScale#

;-------------------------------------------------------------
;-------------------------------------------------------------

[MeasureDate]
Measure=Time
Format="%d/%m/%Y"
Substitute=#Dates#

[MeasureDay]
Measure=Time
Format=%A
Substitute=#Date#

[MeasureDayFirst3Letters]
Measure=String
String="[MeasureDay]"
RegExpSubstitute=1
Substitute="^(.{0,3}).+$":"\1"
DynamicVariables=1

[Measuremonth]
Measure=Time
Format=%B 
FormatLocale=Local

;-------------------------------------------------------------
;-------------------------------------------------------------

[MeasureHours]
Measure=Time
Format=%#Format#
Substitute=#Hours#

[MeasureMinutes]
Measure=Time
Format=%M
Substitute=#Minutes#

[MeasureSeconds]
Measure=Time
Format=%S
Substitute=#Seconds#
OnChangeAction=[!CommandMeasure MeasureFadeTime "Execute 1"]

[MeasureAmPm]
Measure=Time
Format=%p

;-------------------------------------------------------------
;------------------------------------------------------------

[MeterRoundedRectangle]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,(213*#Scale#),(107*#Scale#),20 | Extend MyModifiers1
MyModifiers1=Fill Color #ContainerColor# | StrokeWidth 0 | Stroke Color 46,115,31,0


[MeterDay]
Meter=String
MeasureName=MeasureDayFirst3Letters
FontColor=#CDayFontColor#
FontFace=Rosalia
FontSize=(21*#CScale#)
StringAlign=Center
Text=%1
AntiAlias=1
X=(35*#CScale#)
Y=(20*#CScale#)

[MeterMonth]
Meter=String
MeasureName=Measuremonth
FontColor=#CDateFontColor#
FontFace=Quicksand
FontSize=(15*#CScale#)
AntiAlias=1
X=(-18*#CScale#)r
Y=(50*#CScale#)r

[Meter24hClock]
Meter=String
MeasureName=MeasureHours
MeasureName2=MeasureMinutes
StringAlign=Left
StringCase=Lower
FontFace=Rosalia
FontColor=#CTimeFontColor#
FontSize=(17*#CScale#)
X=(140*#CScale#)
Y=(25*#CScale#)
Text=%1 : %2
AntiAlias=1
DynamicVariables=1
Hidden=#Hidden#

[Meter12hClock]
Meter=String
MeasureName=MeasureHours
MeasureName2=MeasureMinutes
MeasureName3=MeasureAmPm
StringAlign=Left
StringCase=Lower
FontFace=Rosalia
FontColor=#CTimeFontColor#
FontSize=(17*#CScale#)
X=(106*#CScale#)
Y=(25*#CScale#)
Text=%1 : %2 %3
AntiAlias=1
DynamicVariables=1
Hidden=#Hidden2#

[MeterDate]
Meter=String
MeasureName=MeasureDate
FontColor=#CDateFontColor#
FontFace=Quicksand
StringCase=Upper
FontSize=(13*#CScale#)
AntiAlias=1
X=(0*#CScale#)r
Y=(48*#CScale#)r


