[Rainmeter]
Update=-1
Author=Connect-R
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1

[Variables]
@include=#@#Variables.inc
Scale=#DkScale#


;-------------------------------------------------------------
;-------------------------------------------------------------

[MeterRoundedRectangle]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,577,100,30 | Extend MyModifiers
MyModifiers=Fill Color #ContainerColor# | StrokeWidth 0 | Stroke Color 46,115,31,0


[MeterIcon1]
Meter=Image
X=(25*#Scale#)
Y=(14*#Scale#)
W=(52*#Scale#)
DynamicVariables=1
MouseOverAction=[!SetOption #CURRENTSECTION# ImageAlpha 100][!Update]
MouseLeaveAction=[!SetOption #CURRENTSECTION# ImageAlpha 255][!Update]
ImageName=#Icon1NameAndPath#
LeftMouseUpAction=#LocationPath1#
AntiAlias=1

