[Rainmeter]
Update=1000
Author=Connect-R
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1
AccurateText=1

[Variables]
@include=#@#Variables.inc
@include2=#@#Language\#Language#.inc
Scale=#BinScale#

;-------------------------------------------------------------
;-------------------------------------------------------------

[MeasureRecycleBinSize]
Measure=Plugin
Plugin=RecycleManager.dll
Drives=ALL
RecycleType=SIZE
UpdateDivider=120

;-------------------------------------------------------------
;-------------------------------------------------------------

[MeterRoundedRectangleBin]
Meter=Shape
X=(247*#B1Scale#)
Y=(297*#B1Scale#)
Shape=Rectangle 0,0,(121*#Scale#),(44*#Scale#),20 | Extend MyModifiers1
MyModifiers1=Fill Color #ContainerColor# | StrokeWidth 0 | Stroke Color 46,115,31,0

[MeterBinIcon]
Meter=Image
ImageName=#@#Images\bin.png
X=(18*#Scale#)r
Y=(10*#Scale#)r
W=(21*#Scale#)
AntiAlias=1
ImageTint=#ButtonColor#
MouseOverAction=[!SetOption #CURRENTSECTION# ImageAlpha 100][!Update]
MouseLeaveAction=[!SetOption #CURRENTSECTION# ImageAlpha 255][!Update]
LeftMouseUpAction=[!PluginBang "MeasureRecycleBinSize OpenBin"]

[MeterRecycleBinInfoText]
Meter=String
MeasureName=MeasureRecycleBinSize
StringAlign=Right
StringCase=Upper
FontFace=Aquatico
FontColor=#BinTextColor#
FontSize=(13*#Scale#)
X=(90*#Scale#)r
Y=(0*#Scale#)r
Text="%1B"
AntiAlias=1
Autoscale=1
Percentual=0 
NumOfDecimals=0

;-------------------------------------------------------------
;-------------------------------------------------------------

