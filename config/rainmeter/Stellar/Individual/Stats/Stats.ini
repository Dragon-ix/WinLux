[Rainmeter]
Update=1000
Author=Connect-R
BackgroundMode=2
SolidColor=0,0,0,1
DynamicWindowSize=1
AccurateText=1

[Variables]
@include=#@#Variables.inc
Scale=#SScale#

;-------------------------------------------------------------
;-------------------------------------------------------------

[MeasureTotalDiskC]
Measure=FreeDiskSpace
Drive=C:
Total=1
UpdateDivider=120

[MeasureUsedDiskC]
Measure=FreeDiskSpace
Drive=C:
InvertMeasure=1
UpdateDivider=120

[MeasureTotalDiskD]
Measure=FreeDiskSpace
Drive=D:
Total=1
UpdateDivider=120

[MeasureUsedDiskD]
Measure=FreeDiskSpace
Drive=D:
InvertMeasure=1
UpdateDivider=120

[MeasureBatteryPercentage]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Percent

;-------------------------------------------------------------
;-------------------------------------------------------------
[MeterRoundedRectangle]

Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,(165*#Scale#),(228*#Scale#),20 | Extend MyModifiers1
MyModifiers1=Fill Color #ContainerColor# | StrokeWidth 0 | Stroke Color 46,115,31,0

;-------------------------------------------------------------
;-------------------------------------------------------------

[MeterBarDiskC]
Meter=Bar
MeasureName=MeasureUsedDiskC
BarOrientation=Horizontal
X=(14*#Scale#)
Y=(69*#Scale#)
W=(140*#Scale#)
H=(6.6*#Scale#)
BarColor=#BarColor#
SolidColor=255,255,255,55

[MeterBarDiskD]
Meter=Bar
MeasureName=MeasureUsedDiskD
BarOrientation=Horizontal
X=(0*#Scale#)r
Y=(51*#Scale#)R
W=(140*#Scale#)
H=(6.6*#Scale#)
BarColor=#BarColor#
SolidColor=255,255,255,55

[MeterBarBattery]
Meter=Bar
MeasureName=MeasureBatteryPercentage
BarOrientation=Horizontal
X=(0*#Scale#)r
Y=(51*#Scale#)R
W=(140*#Scale#)
H=(6.6*#Scale#)
BarColor=#BarColor#
SolidColor=255,255,255,55

;-------------------------------------------------------------
;-------------------------------------------------------------

[MeterDriveC]
Meter=String
StringAlign=Left
FontFace=Product Sans
FontColor=255,255,255
FontSize=(14*#Scale#)
X=(17*#Scale#)
Y=(31*#Scale#)
Text=C:
AntiAlias=1

[MeterDriveD]
Meter=String
StringAlign=Left
FontFace=Product Sans
FontColor=255,255,255
FontSize=(14*#Scale#)
X=(0*#Scale#)r
Y=(39*#Scale#)R
Text=D:
AntiAlias=1

[MeterBattery]
Meter=String
StringAlign=Left
FontFace=Product Sans
FontColor=255,255,255
FontSize=(12*#Scale#)
X=(0*#Scale#)r
Y=(41*#Scale#)R
Text=Battery:
AntiAlias=1

;-------------------------------------------------------------
;-------------------------------------------------------------

[MeterValueDiskC]
Meter=String
MeasureName=MeasureUsedDiskC
MeasureName2=MeasureTotalDiskC
StringAlign=Left
FontFace=Product Sans
FontColor=255,255,255,150
FontSize=(10*#Scale#)
X=(17*#Scale#)
Y=(50*#Scale#)
Text="%1B / %2B"
AntiAlias=1
NumOfDecimals=1
AutoScale=1

[MeterValueDiskD]
Meter=String
MeasureName=MeasureUsedDiskD
MeasureName2=MeasureTotalDiskD
StringAlign=Left
FontFace=Product Sans
FontColor=255,255,255,150
FontSize=(10*#Scale#)
X=(0*#Scale#)r
Y=(45*#Scale#)R
Text="%1B / %2B"
AntiAlias=1
NumOfDecimals=1
AutoScale=1

[MeterValueBattery]
Meter=String
MeasureName=MeasureBatteryPercentage
StringAlign=Left
FontFace=Product Sans
FontColor=255,255,255,150
FontSize=(10*#Scale#)
X=(0*#Scale#)r
Y=(45*#Scale#)R
Text="%1%"
AntiAlias=1
NumOfDecimals=0
AutoScale=1
