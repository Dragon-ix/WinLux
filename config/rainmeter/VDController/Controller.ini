[Rainmeter]
Update=100
AccurateText=1

[Variables]
D1_X=1105
D1_Y=213
D2_X=1416
D2_Y=609

[MeasureState]
Measure=Plugin
Plugin=QuotePlugin
PathName=#CURRENTPATH#state.txt
Subfolders=0

[MeasureIsDesktop1]
Measure=Calc
Formula=MeasureState = 0 ? 1 : 0
DynamicVariables=1
IfCondition=MeasureIsDesktop1 = 1
IfTrueAction=[!Move #D1_X# #D1_Y# "ModularVisualizer\Main"][!Move -10000 -10000 "Visualizer_Desktop2\Main"]

[MeasureIsDesktop2]
Measure=Calc
Formula=MeasureState = 1 ? 1 : 0
DynamicVariables=1
IfCondition=MeasureIsDesktop2 = 1
IfTrueAction=[!Move -10000 -10000 "ModularVisualizer\Main"][!Move #D2_X# #D2_Y# "Visualizer_Desktop2\Main"]

[MeterBackground]
Meter=String